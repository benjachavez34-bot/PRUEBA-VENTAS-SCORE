name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar proyecto web
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK para descarga fácil
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/VentasScore.apk

      - name: Subir APK como artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: VentasScore-APK
          path: build-output/VentasScore.apk
          retention-days: 30

      - name: Crear o actualizar Release con el APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "Ventas Score - Última versión APK"
          body: |
            📱 **Ventas Score - Instalador Android (.apk)**
            
            Este APK está enlazado a la web en línea (`https://benjachavez34-bot.github.io/PRUEBA-VENTAS-SCORE/`).
            - Cualquier cambio futuro que subas a GitHub se actualizará automáticamente en la app al abrirla.
            - Incluye permisos para escáner de código de barras (cámara) y notificaciones móviles.
          files: build-output/VentasScore.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
